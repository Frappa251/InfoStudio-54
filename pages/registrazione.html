<!DOCTYPE html>
<!--
    registrazione.html
    Form per creare un nuovo account. I dati vengono mandati con AJAX
    all'endpoint api/register.php (vedi assets/js/auth.js).
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati | InfoStudio-54</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo-neon-wrapper">
            <div class="logo-neon" id="mainLogo">
                <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <span class="word-info">Info</span><span class="word-studio">Studio</span><span class="hyphen">-</span><span class="number-54">54</span>
                </a>
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="storia.html">Storia</a></li>
            <li><a href="menu.html">Menu Tavoli</a></li>
            <li><a href="login.html">Accedi</a></li>
            <li><a href="prenotazioni.html" class="btn-prenota">Prenota Ora</a></li>
        </ul>
    </nav>


    <!-- ============================================================
         FORM DI REGISTRAZIONE
         id="register-form" -> agganciato dal JS in auth.js.
         L'attributo "required" sui campi è una prima validazione fatta
         direttamente dal browser; la vera validazione la fa il PHP.
         ============================================================ -->
    <div class="auth-container">
        <div class="auth-box">

            <h2>Unisciti alla Notte</h2>
            <p>Crea il tuo account VIP</p>

            <form id="register-form">

                <!-- Nome e Cognome sulla stessa riga (gestito dal CSS) -->
                <div class="input-row">
                    <div class="input-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required placeholder="Il tuo nome">
                    </div>

                    <div class="input-group">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" required placeholder="Il tuo cognome">
                    </div>
                </div>

                <div class="input-group">
                    <label for="telefono">Numero di Cellulare</label>
                    <input type="tel" id="telefono" required placeholder="Es. 333 1234567">
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="tu@esempio.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Minimo 6 caratteri">
                </div>

                <button type="submit" class="btn-prenota auth-btn">Registrati</button>
            </form>

            <p class="auth-switch">Hai già un account? <a href="login.html">Accedi qui</a></p>
        </div>
    </div>


    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>© 2026 InfoStudio-54. Tutti i diritti riservati.</p>
        </div>
    </footer>


    <!-- SCRIPT: jQuery + api.js + auth.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
