<!DOCTYPE html>
<!--
    login.html
    Form di accesso al sito. L'utente inserisce email e password,
    e i dati vengono mandati con AJAX all'endpoint api/login.php
    (vedi assets/js/auth.js).
-->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | InfoStudio-54</title>

    <!-- Stile generale + stile specifico per i form di autenticazione -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo-neon-wrapper">
            <div class="logo-neon" id="mainLogo">
                <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <span class="word-info">Info</span><span class="word-studio">Studio</span><span class="hyphen">-</span><span class="number-54">54</span>
                </a>
            </div>
        </div>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="storia.html">Storia</a></li>
            <li><a href="menu.html">Menu Tavoli</a></li>
            <li><a href="login.html">Accedi</a></li>
            <li><a href="prenotazioni.html" class="btn-prenota">Prenota Ora</a></li>
        </ul>
    </nav>


    <!-- ============================================================
         BOX DI LOGIN
         Il form ha id="login-form": auth.js lo aggancia all'evento
         submit, blocca il refresh della pagina e manda i dati a
         api/login.php con $.ajax.
         ============================================================ -->
    <div class="auth-container">
        <div class="auth-box">

            <h2>Bentornato</h2>
            <p>Accedi al tuo account VIP</p>

            <form id="login-form">

                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="tu@esempio.com">
                </div>

                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="La tua password">
                </div>

                <button type="submit" class="btn-prenota auth-btn">Entra</button>
            </form>

            <p class="auth-switch">Nuovo cliente? <a href="registrazione.html">Registrati qui</a></p>
        </div>
    </div>


    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>© 2026 InfoStudio-54. Tutti i diritti riservati.</p>
        </div>
    </footer>


    <!-- SCRIPT: jQuery + api.js + auth.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
